name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.1.0
        with:
          go-version: "1.22"

      - name: Build
        run: go build ./...

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: Test (race)
        run: go test -race -count=1 ./...

      - name: No external dependencies
        run: |
          if grep -q '^require' go.mod; then echo "go.mod must have no require"; exit 1; fi

      - name: Simulation
        run: bash docs/demo/simulate.sh

      - name: Quickstart
        run: |
          go install ./cmd/telegraph
          PATH="$(go env GOPATH)/bin:$PATH" bash docs/demo/quickstart.sh

      - name: Install script
        run: |
          shellcheck scripts/*.sh
          BINDIR="$RUNNER_TEMP/bin" sh scripts/install.sh
          "$RUNNER_TEMP/bin/telegraph" version

      - uses: actions/setup-go@v7.1.0
        with:
          go-version: stable

      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
