# Repository labels. Apply with:
#   gh label create NAME --color HEX --description TEXT --force -R ao3575911/telegraph
# (one line per entry below).

# Semantic versioning impact of a change
- name: "semver:major"
  color: "b60205"
  description: "Breaking change to the protocol, on-disk format or CLI"
- name: "semver:minor"
  color: "fbca04"
  description: "Backwards-compatible feature"
- name: "semver:patch"
  color: "0e8a16"
  description: "Backwards-compatible fix"

# Type
- name: "type:bug"
  color: "d73a4a"
  description: "Something does not work as documented"
- name: "type:feature"
  color: "a2eeef"
  description: "New capability"
- name: "type:docs"
  color: "0075ca"
  description: "Documentation only"
- name: "type:test"
  color: "c5def5"
  description: "Tests and simulation"
- name: "type:ci"
  color: "ededed"
  description: "Workflows and release tooling"
- name: "type:chore"
  color: "e4e669"
  description: "Maintenance, refactoring, dependencies"
- name: "type:security"
  color: "5319e7"
  description: "Security hardening"

# Priority
- name: "priority:critical"
  color: "b60205"
  description: "Fix before anything else"
- name: "priority:high"
  color: "d93f0b"
  description: "Next release"
- name: "priority:medium"
  color: "fbca04"
  description: "Planned"
- name: "priority:low"
  color: "c2e0c6"
  description: "When convenient"

# Area
- name: "area:log"
  color: "1d76db"
  description: "Signed entries, hash chains, Merkle roots"
- name: "area:crdt"
  color: "1d76db"
  description: "Registry merge and resolution"
- name: "area:checkpoint"
  color: "1d76db"
  description: "Committees, checkpoints, audit, pins"
- name: "area:swap"
  color: "1d76db"
  description: "Atomic handle swaps and bio cards"
- name: "area:transport"
  color: "1d76db"
  description: "Telegram transport, file bus, gossip"
- name: "area:cli"
  color: "1d76db"
  description: "Command-line interface and output"
- name: "area:docs"
  color: "1d76db"
  description: "README, wiki, site, demos"
- name: "area:ci"
  color: "1d76db"
  description: "GitHub Actions and releases"
